<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FSI Trading Dashboard</title>
<style>
  :root {
    --bg: #0d1117; --fg: #e6edf3; --muted: #7d8590;
    --card: #161b22; --border: #30363d;
    --green: #3fb950; --red: #f85149; --yellow: #d29922; --blue: #58a6ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", monospace;
         background: var(--bg); color: var(--fg); font-size: 14px; }
  h1 { margin: 0 0 12px 0; font-size: 22px; }
  h2 { margin: 0 0 8px 0; font-size: 15px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; margin-bottom: 12px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
  .stat { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed var(--border); }
  .stat:last-child { border-bottom: none; }
  .stat .k { color: var(--muted); }
  .stat .v { font-weight: 600; }
  .ok { color: var(--green); }
  .bad { color: var(--red); }
  .warn { color: var(--yellow); }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { padding: 4px 6px; text-align: left; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; font-size: 11px; }
  tr:hover td { background: rgba(88,166,255,0.05); }
  pre.log { background: #010409; color: #c9d1d9; padding: 10px; border-radius: 6px; overflow-x: auto;
            max-height: 340px; overflow-y: scroll; font-size: 11px; line-height: 1.35; margin: 0; }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .badge.ok { background: rgba(63,185,80,0.15); color: var(--green); }
  .badge.bad { background: rgba(248,81,73,0.15); color: var(--red); }
  .side.BUY { color: var(--green); }
  .side.SELL { color: var(--red); }
  small { color: var(--muted); }
</style>
</head>
<body>
<div class="top">
  <h1>FSI Trading Dashboard</h1>
  <div><small id="update-ts">加载中...</small> · <a href="#" onclick="loadAll();return false" style="color:var(--blue)">刷新</a></div>
</div>

<div class="grid">
  <!-- Health -->
  <div class="card">
    <h2>System Health</h2>
    <div id="health"></div>
  </div>

  <!-- NAV -->
  <div class="card">
    <h2>NAV / Drawdown</h2>
    <div id="nav"></div>
  </div>

  <!-- Trader state (peak, positions summary) -->
  <div class="card">
    <h2>持仓</h2>
    <div id="positions"></div>
  </div>
</div>

<div class="grid">
  <!-- Trades -->
  <div class="card">
    <h2>最近 20 笔 Trade</h2>
    <div id="trades"></div>
  </div>

  <!-- Log tail -->
  <div class="card" style="grid-column: span 2;">
    <h2>今日 log (最后 100 行)</h2>
    <pre class="log" id="log">加载中...</pre>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const fmt = n => n === null || n === undefined ? '-' : (typeof n === 'number' ? n.toLocaleString('en-US', {maximumFractionDigits: 2}) : n);
const cls = (v, threshold=0) => v > threshold ? 'ok' : (v < threshold ? 'bad' : '');

async function fetchJson(url) {
  const r = await fetch(url);
  return r.json();
}

async function loadHealth() {
  const h = await fetchJson('/api/health');
  const orchBadge = h.orchestrator_alive ? '<span class="badge ok">alive</span>' : '<span class="badge bad">dead</span>';
  const openBadge = h.opend_alive ? '<span class="badge ok">alive</span>' : '<span class="badge bad">down</span>';
  $('health').innerHTML = `
    <div class="stat"><span class="k">orchestrator</span><span class="v">${orchBadge} PID ${h.orchestrator_pid || '-'}</span></div>
    <div class="stat"><span class="k">moomoo OpenD</span><span class="v">${openBadge}</span></div>
    <div class="stat"><span class="k">今日 log</span><span class="v">${(h.last_log_mtime || '-').slice(0,19)}</span></div>
    <div class="stat"><span class="k">当前 UTC</span><span class="v">${h.now.slice(0,19)}</span></div>
  `;
  $('update-ts').textContent = '更新: ' + new Date().toLocaleTimeString('zh-CN');
}

async function loadNav() {
  const n = await fetchJson('/api/nav');
  const dd = n.dd_pct || 0;
  const ddClass = dd < -5 ? 'bad' : (dd < -2 ? 'warn' : 'ok');
  $('nav').innerHTML = `
    <div class="stat"><span class="k">当前 NAV</span><span class="v">$${fmt(n.current)}</span></div>
    <div class="stat"><span class="k">Peak NAV</span><span class="v">$${fmt(n.peak)}</span></div>
    <div class="stat"><span class="k">回撤 DD</span><span class="v ${ddClass}">${dd.toFixed(2)}%</span></div>
    <div class="stat"><span class="k">数据点</span><span class="v">${(n.points || []).length}</span></div>
  `;
}

async function loadPositions() {
  const p = await fetchJson('/api/positions');
  if (!p.positions || p.positions.length === 0) {
    $('positions').innerHTML = '<div><small>无持仓状态记录</small></div>';
    return;
  }
  const rows = p.positions
    .filter(pos => ['BUY','PYRAMID','REBUY'].includes(pos.last_action))
    .map(pos => `
    <tr>
      <td><b>${pos.ticker.replace('US.','')}</b>${pos.is_core?' <small>core</small>':' <small>sat</small>'}</td>
      <td><span class="side ${pos.last_side}">${pos.last_action}</span></td>
      <td>${pos.last_qty || '-'}</td>
      <td>$${fmt(pos.entry_price || pos.last_price)}</td>
      <td>${pos.pyramid_layer ? 'L'+pos.pyramid_layer : '-'}</td>
      <td><small>${(pos.last_time_utc || '').slice(5,16)}</small></td>
    </tr>
  `).join('');
  $('positions').innerHTML = `
    <table>
      <thead><tr><th>Ticker</th><th>Action</th><th>Qty</th><th>Entry</th><th>Layer</th><th>Time</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

async function loadTrades() {
  const t = await fetchJson('/api/trades?n=20');
  if (!t.trades || t.trades.length === 0) {
    $('trades').innerHTML = '<div><small>暂无 trade log</small></div>';
    return;
  }
  const rows = t.trades.map(tr => `
    <tr>
      <td><small>${tr.ts.slice(5,16).replace('T',' ')}</small></td>
      <td><b>${(tr.ticker || '').replace('US.','')}</b></td>
      <td><span class="side ${tr.side}">${tr.side}</span></td>
      <td>${tr.qty}</td>
      <td>$${fmt(tr.price)}</td>
      <td><small>${tr.dry_run?'DRY':'LIVE'} conf=${(tr.decision||{}).confidence||'-'}</small></td>
    </tr>
  `).join('');
  $('trades').innerHTML = `
    <table>
      <thead><tr><th>Time</th><th>Ticker</th><th>Side</th><th>Qty</th><th>Price</th><th>Meta</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

async function loadLog() {
  const l = await fetchJson('/api/log?n=100');
  const lines = (l.lines || []).join('\n');
  const el = $('log');
  el.textContent = lines || '(no log yet)';
  el.scrollTop = el.scrollHeight;  // 自动滚到底
}

async function loadAll() {
  await Promise.all([loadHealth(), loadNav(), loadPositions(), loadTrades(), loadLog()]);
}

loadAll();
setInterval(loadAll, 30000);   // 30s 自动刷新
</script>
</body>
</html>
